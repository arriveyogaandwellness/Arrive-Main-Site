<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071c1a" />
  <title>Arrive | Enter the Sanctuary</title>
  <meta name="description" content="Welcome to Arrive Yoga &amp; Wellness Center in Costa Rica." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #f7f5ed; --soft-ink: rgba(247, 245, 237, .78); --teal: #8bd8bd; --night: #071c1a; --rainbow: linear-gradient(105deg, #ff4f9a 0%, #ff7a2f 23%, #ffd84d 43%, #39d6c0 67%, #55b9ff 84%, #c477ff 100%); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--night); color: var(--ink); font-family: "Plus Jakarta Sans", sans-serif; }
    .welcome { isolation: isolate; width: 100%; height: 100svh; position: relative; display: grid; place-items: center; overflow: hidden; background: var(--night); }
    .welcome-video, .welcome-poster, .welcome-shade, .welcome-grain, .welcome-scanlines { position: absolute; inset: 0; }
    .welcome-video, .welcome-poster { width: 100%; height: 100%; object-fit: cover; }
    .welcome-video { z-index: -5; opacity: 0; transition: opacity 1.2s ease; }
    .welcome-video.is-ready { opacity: .78; }
    .welcome-poster { z-index: -6; background: url("/assets/welcome/welcome-background.png") center / cover, url("/assets/pages/home/hero-poolside-dining.png") center / cover; filter: saturate(.92) contrast(1.08); transform: scale(1.04); }
    .welcome-shade { z-index: -4; background: linear-gradient(115deg, rgba(4, 24, 21, .95) 0%, rgba(4, 24, 21, .54) 52%, rgba(4, 24, 21, .3) 100%), radial-gradient(circle at 70% 38%, transparent 0 12%, rgba(4, 24, 21, .5) 72%); transition: opacity 1.2s ease; }
    .welcome-grain { z-index: 4; opacity: .12; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E"); mix-blend-mode: screen; }
    .welcome-scanlines { z-index: 3; pointer-events: none; opacity: .11; background: repeating-linear-gradient(0deg, transparent 0 4px, rgba(255,255,255,.08) 5px); }
    .orb { position: absolute; width: min(52vw, 680px); aspect-ratio: 1; right: -12vw; top: 7vh; z-index: -3; border: 1px solid rgba(139, 216, 189, .35); border-radius: 50%; box-shadow: 0 0 100px rgba(139, 216, 189, .1), inset 0 0 80px rgba(139, 216, 189, .07); animation: breathe 8s ease-in-out infinite; }
    .orb::after { content: ""; position: absolute; inset: 9%; border: 1px solid rgba(247, 245, 237, .18); border-radius: inherit; }
    .welcome-content { width: min(100% - 3rem, 1180px); padding: 3rem 0; position: relative; z-index: 5; animation: lift-in 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: flex; align-items: center; gap: .8rem; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: .66rem; letter-spacing: .28em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 3.5rem; height: 2px; background: var(--rainbow); }
    h1 { max-width: 760px; margin: 1.5rem 0 1.1rem; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 18px rgba(0, 0, 0, .28)); font: 500 clamp(4.5rem, 14vw, 11.5rem)/.75 "Cormorant Garamond", serif; letter-spacing: -.06em; }
    h1 em { display: block; margin-left: .18em; background: linear-gradient(105deg, #ffd84d 0%, #ff7a2f 34%, #ff4f9a 62%, #c477ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 400; }
    .intro-copy { max-width: 360px; margin: 0 0 2.3rem 3.5rem; color: var(--soft-ink); font-size: .88rem; line-height: 1.75; }
    .welcome-actions { display: flex; align-items: center; gap: 1.5rem; margin-left: 3.5rem; }
    .enter-button { display: inline-flex; align-items: center; gap: .8rem; border: 1px solid rgba(255, 255, 255, .65); border-radius: 0; padding: 1rem 1.4rem; color: #1c1424; background: var(--rainbow); box-shadow: 0 10px 28px rgba(255, 79, 154, .22); font: 600 .68rem "Plus Jakarta Sans", sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: transform .25s ease, background .25s ease, color .25s ease, box-shadow .25s ease; }
    .enter-button:hover, .enter-button:focus-visible { background: transparent; color: var(--ink); transform: translateY(-3px); outline: none; }
    .enter-button span { font-size: 1rem; line-height: 0; }
    .skip-link { color: var(--soft-ink); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: .2rem; transition: color .2s ease, border-color .2s ease; }
    .skip-link:hover, .skip-link:focus-visible { color: var(--ink); border-color: var(--ink); outline: none; }
    .welcome-meta { position: absolute; right: 0; bottom: 3rem; display: flex; gap: 2rem; color: var(--soft-ink); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; }
    .welcome-meta strong { display: block; margin-top: .45rem; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: .72rem; font-weight: 600; }
    .sound-note { margin: 1.25rem 0 0 3.5rem; color: var(--soft-ink); font-size: .61rem; letter-spacing: .15em; text-transform: uppercase; }
    .welcome.is-playing .welcome-content { animation: dissolve 1s ease forwards; pointer-events: none; }
    .welcome.is-playing .welcome-video { opacity: 1; }
    .welcome.is-playing .welcome-shade { opacity: .08; }
    .welcome.is-playing .welcome-poster { opacity: 0; transition: opacity 1.1s ease; }
    .welcome.is-finished .welcome-content { animation: lift-in .8s ease both; }
    .welcome.is-finished .welcome-actions { pointer-events: auto; }
    .welcome.is-finished .enter-button { background: var(--ink); color: var(--night); border-color: var(--ink); }
    @keyframes lift-in { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dissolve { to { opacity: 0; transform: translateY(-24px); } }
    @keyframes breathe { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.06) rotate(4deg); } }
    @media (max-width: 700px) {
      .welcome.is-playing .welcome-video { object-fit: contain; background: var(--night); }
      .welcome-content { width: min(100% - 2.5rem, 560px); padding-top: 5rem; }
      h1 { font-size: clamp(4.3rem, 24vw, 8rem); }
      .intro-copy, .welcome-actions { margin-left: 0; }
      .welcome-actions { align-items: flex-start; flex-direction: column; gap: 1.25rem; }
      .welcome-meta { position: static; margin-top: 3.5rem; gap: 1.25rem; }
      .sound-note { margin-left: 0; }
      .orb { width: 90vw; right: -35vw; top: 12vh; }
    }
    @media (max-width: 700px) and (max-height: 700px) {
      .welcome-content { padding: 1.25rem 0; }
      h1 { margin: 1rem 0 .8rem; font-size: clamp(3.8rem, 20vw, 6.2rem); }
      .intro-copy { margin-bottom: 1.25rem; line-height: 1.5; }
      .welcome-actions { gap: .8rem; }
      .welcome-meta { margin-top: 1.5rem; }
      .sound-note { margin-top: .75rem; }
    }
    @media (orientation: landscape) and (max-height: 600px) {
      html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      .welcome { height: auto; min-height: 100svh; overflow: visible; display: block; padding: .75rem 0 2rem; }
      .welcome-content { width: calc(100% - 3rem); min-height: calc(100svh - 2.75rem); margin: 0 auto; padding: .75rem 0; }
      .eyebrow { font-size: .56rem; }
      h1 { max-width: 620px; margin: .7rem 0 .55rem; font-size: clamp(3.2rem, 10vw, 5.5rem); }
      .intro-copy { max-width: 330px; margin: 0 0 1rem 2rem; font-size: .75rem; line-height: 1.4; }
      .welcome-actions { margin-left: 2rem; gap: 1rem; }
      .enter-button { padding: .75rem 1rem; }
      .sound-note { margin: .65rem 0 0 2rem; font-size: .55rem; }
      .welcome-meta { position: static; justify-content: flex-end; margin-top: 1rem; gap: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="welcome" id="welcome-screen">
    <div class="welcome-poster" aria-hidden="true"></div>
    <video class="welcome-video" id="intro-video" preload="auto" playsinline muted poster="/assets/welcome/welcome-background.png" aria-label="Arrive sanctuary introduction">
      <source src="/assets/welcome/Arrive%20welcome%20animation.mp4" type="video/mp4" />
    </video>
    <div class="welcome-shade" aria-hidden="true"></div>
    <div class="welcome-grain" aria-hidden="true"></div>
    <div class="welcome-scanlines" aria-hidden="true"></div>
    <div class="orb" aria-hidden="true"></div>
    <section class="welcome-content" aria-labelledby="welcome-title">
      <div class="eyebrow">Arrive Yoga &amp; Wellness Center</div>
      <h1 id="welcome-title">Welcome<em>to Arrive.</em></h1>
      <p class="intro-copy">A heart-led sanctuary for movement, mindfulness, self-expression, and coming home to yourself.</p>
      <div class="welcome-actions">
        <button class="enter-button" id="enter-button" type="button"><span aria-hidden="true">↗</span> Begin your journey</button>
        <a class="skip-link" href="/home.html">Skip intro</a>
      </div>
      <div class="welcome-meta" aria-label="Location and film duration">
        <div>Costa Rica<strong>Amanti Sanctuary</strong></div>
        <div>Film<strong>00:15</strong></div>
      </div>
      <div class="sound-note">Best experienced with sound</div>
    </section>
  </main>
  <script>
    (() => {
      const screen = document.getElementById('welcome-screen');
      const video = document.getElementById('intro-video');
      const enterButton = document.getElementById('enter-button');
      let filmStarted = false;
      video.addEventListener('canplay', () => video.classList.add('is-ready'));
      video.addEventListener('ended', () => {
        screen.classList.remove('is-playing');
        screen.classList.add('is-finished');
        enterButton.innerHTML = '<span aria-hidden="true">↗</span> Continue to retreat';
        enterButton.addEventListener('click', () => { window.location.href = '/home.html'; }, { once: true });
      });
      enterButton.addEventListener('click', () => {
        if (!filmStarted) {
          filmStarted = true;
          video.removeAttribute('muted');
          video.muted = false;
          video.volume = 1;
          screen.classList.add('is-playing');
          video.play().catch(() => {
            filmStarted = false;
            screen.classList.remove('is-playing');
            document.querySelector('.sound-note').textContent = 'Sound could not start. Check your device volume.';
          });
        } else {
          window.location.href = '/home.html';
        }
      });
    })();
  </script>
</body>
